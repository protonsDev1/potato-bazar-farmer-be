<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to Potato Bazaar</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color:#f4f4f4;">
  <table align="center" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 0 10px rgba(0,0,0,0.1);">
    <tr>
      <td style="background-color:#333333; padding:20px; text-align:center; color:#ffffff; font-size:24px; font-weight:bold;">
        Potato Bazaar
      </td>
    </tr>
    <tr>
      <td style="padding:20px; color:#333333; font-size:16px; line-height:1.5;">
        <p>Dear <strong>{{name}}</strong>,</p>
        <p>Your Agent account has been successfully created.</p>
        <p><strong>Login Credentials:</strong></p>
        <table cellpadding="0" cellspacing="0" width="100%" style="margin:10px 0; border-collapse:collapse;">
          <tr>
            <td style="padding:10px; background-color:#f9f9f9; border:1px solid #dddddd;"><strong>Agent ID</strong></td>
            <td style="padding:10px; background-color:#f9f9f9; border:1px solid #dddddd;">{{agentId}}</td>
          </tr>
          <tr>
            <td style="padding:10px; background-color:#f9f9f9; border:1px solid #dddddd;"><strong>Password</strong></td>
            <td style="padding:10px; background-color:#f9f9f9; border:1px solid #dddddd;">{{password}}</td>
          </tr>
        </table>
        <p>Regards,<br/>Team Potato Bazaar</p>
      </td>
    </tr>
    <tr>
      <td style="background-color:#f4f4f4; padding:10px; text-align:center; font-size:12px; color:#777777;">
        &copy; 2025 Potato Bazaar. All rights reserved.
      </td>
    </tr>
  </table>
</body>
</html>
