<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Potato Bazaar Login Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f7f7f7;font-family:Arial,sans-serif;">
  <table align="center" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:30px auto;background-color:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
    
    <!-- Header -->
    <tr>
      <td style="background-color:#f58220;padding:18px 0;text-align:center;color:#ffffff;font-size:22px;font-weight:bold;">
        Potato Bazaar
      </td>
    </tr>

    <!-- Body -->
    <tr>
      <td style="padding:28px 25px 35px;color:#333333;font-size:15px;line-height:1.6;">
        Dear <strong>{{name}}</strong>,<br><br>
        
        Please find your login credentials below:<br><br>

        <table width="100%" cellpadding="0" cellspacing="0" style="margin:10px 0;border-collapse:collapse;">
          <tr>
            <td style="padding:10px 12px;background:#fafafa;border:1px solid #e0e0e0;width:40%;font-weight:bold;">Agent ID</td>
            <td style="padding:10px 12px;background:#fafafa;border:1px solid #e0e0e0;">{{agentId}}</td>
          </tr>
          <tr>
            <td style="padding:10px 12px;background:#fafafa;border:1px solid #e0e0e0;font-weight:bold;">Password</td>
            <td style="padding:10px 12px;background:#fafafa;border:1px solid #e0e0e0;">{{password}}</td>
          </tr>
        </table>

        <div style="text-align:center;margin:30px 0;">
          <a href="{{loginUrl}}" target="_blank" style="background-color:#f58220;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:6px;font-size:15px;font-weight:bold;display:inline-block;">
            Login Now
          </a>
        </div>

        If you face any issues, reply to this email or contact 
        <a href="mailto:support@potatobazaar.com" style="color:#f58220;text-decoration:none;">support@potatobazaar.com</a>.<br><br>

        Regards,<br>
        <strong>Team Potato Bazaar</strong>
      </td>
    </tr>
  </table>
</body>
</html>
